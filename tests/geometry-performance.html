<!doctype html><html><head><meta charset="utf-8"><title>Geometry transport and draw qualification</title></head><body style="margin:0"><div id="viewer" style="width:600px;height:600px"></div><script type="module">
import {NeuroSurfaceViewer,MultiLayerNeuroSurface,SurfaceGeometry,SurfaceDomain,SurfaceMetric,GeometryWorkerClient,DataLayer,parseGIfTISurface,buildSurfaceSmoothingPlan} from '/src/index.ts';
window.geometryPerformance = async () => {
 const errors=[],viewer=new NeuroSurfaceViewer(document.querySelector('#viewer'),600,600,{backgroundColor:0x000000});viewer.stopRenderLoop();
 const client=new GeometryWorkerClient({workerFactory:()=>new Worker('/dist/surfview.geometry.worker.js',{type:'module'})});
 try {
  const xml=await(await fetch('/tests/data/fsaverage5-lh-pial.gii')).text(),g=parseGIfTISurface(xml),n=g.vertices.length/3;
  const surface=new MultiLayerNeuroSurface(new SurfaceGeometry(g.vertices,g.faces,'left'));viewer.addSurface(surface,'lh');viewer.fitToView();
  const layer=new DataLayer('derived',new Float32Array(n),null,'viridis',{range:[-1.5,1.5]});viewer.addLayer('lh',layer);viewer.render();
  const domain=new SurfaceDomain({id:'browser-perf',structure:'left',vertexCount:n,faces:g.faces}),metric=new SurfaceMetric(domain,{positions:g.vertices,frame:'fsaverage-surface-RAS',units:'mm'});
  const d=await client.registerDomain(domain),m=await client.registerMetric(d,metric),plan=await client.buildSmoothing(m,{fwhmMm:3}),prepared=await client.prepareSmoothing(plan);
  const gl=viewer.renderer.getContext(),debug=gl.getExtension('WEBGL_debug_renderer_info'),timer=gl.getExtension('EXT_disjoint_timer_query_webgl2');
  const frameHashes=[];
  const renderer=debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),samples=[];
  for(let f=0;f<9;f++){
   const values=Float64Array.from({length:n},(_,v)=>Math.sin(v*.01+f*.2)),submit=performance.now(),pending=client.applyBatch(prepared,[values]),afterSubmit=performance.now(),result=(await pending)[0],afterWorker=performance.now();
   const float=Float32Array.from(result.values),afterBuffer=performance.now();
   const query=timer?gl.createQuery():null;if(query)gl.beginQuery(timer.TIME_ELAPSED_EXT,query);
   layer.setData(float);viewer.render();if(query)gl.endQuery(timer.TIME_ELAPSED_EXT);gl.finish();const afterDraw=performance.now();
   if(f===0||f===8){const pixels=new Uint8Array(600*600*4);gl.readPixels(0,0,600,600,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let hash=2166136261;for(const value of pixels)hash=Math.imul(hash^value,16777619);frameHashes.push(hash>>>0);}
   let gpuUploadDrawMs=null;if(query){for(let attempt=0;attempt<50&&!gl.getQueryParameter(query,gl.QUERY_RESULT_AVAILABLE);attempt++)await new Promise(resolve=>setTimeout(resolve,1));if(gl.getQueryParameter(query,gl.QUERY_RESULT_AVAILABLE)&&!gl.getParameter(timer.GPU_DISJOINT_EXT))gpuUploadDrawMs=gl.getQueryParameter(query,gl.QUERY_RESULT)/1e6;gl.deleteQuery(query);}

   if(f>1)samples.push({gpuUploadDrawMs,submitCopyMs:afterSubmit-submit,workerRoundTripMs:afterWorker-submit,displayBufferMs:afterBuffer-afterWorker,drawAndFinishMs:afterDraw-afterBuffer,totalMs:afterDraw-submit});
  }
  const frames=Array.from({length:3},(_,f)=>Float64Array.from({length:n},(_,v)=>f===0?7:Math.sin(v*.01+f))),masks=frames.map((_,f)=>Uint8Array.from({length:n},(_,v)=>+(f===0||v%(13+f)!==0)));
  const streamed=await client.smoothBatch(m,frames,{fwhmMm:3},{frameValidity:masks});let maxDifference=0;const reference=buildSurfaceSmoothingPlan(metric,{fwhmMm:3});
  for(let f=0;f<frames.length;f++){const expected=reference.apply(frames[f],{validity:masks[f]});for(let v=0;v<n;v++)maxDifference=Math.max(maxDifference,Math.abs(expected.values[v]-streamed[f].values[v]));}
  if(maxDifference>1e-12)throw new Error('Streamed dynamic-mask comparison failed');
  const controller=new AbortController(),job=client.smoothBatch(m,frames,{fwhmMm:8},{frameValidity:masks},{signal:controller.signal});const observed=job.then(()=>({cancelled:false}),e=>({cancelled:e.code==='cancelled'}));await new Promise(resolve=>setTimeout(resolve,20));const abortAt=performance.now();controller.abort();const cancellation=await observed,clientCancelMs=performance.now()-abortAt;const ack=performance.now();await client.release(prepared);const releaseAfterAbortMs=performance.now()-ack;
  viewer.render();gl.finish();
  const pixels=new Uint8Array(600*600*4);gl.readPixels(0,0,600,600,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let nonblack=0;for(let i=0;i<pixels.length;i+=4)if(pixels[i]+pixels[i+1]+pixels[i+2]>30)nonblack++;
  for(const h of [plan,m,d])await client.release(h);
  return {vertices:n,renderer,frameHashes,timerExtension:!!timer,timingNote:'CPU wall clock: submit includes copies; worker round trip includes execution and transport. drawAndFinish includes DataLayer update, viewer render, uploads/draw and gl.finish; it is not isolated GPU upload time. Two warmups, seven samples.',samples,maxDynamicMaskDifference:maxDifference,cancellation,clientCancelMs,releaseAfterAbortMs,nonblackPixels:nonblack,heap:performance.memory?{used:performance.memory.usedJSHeapSize,total:performance.memory.totalJSHeapSize}:null};
 }finally{client.dispose();viewer.dispose();}
};
window.geometryPerformanceReady=true;
</script></body></html>
