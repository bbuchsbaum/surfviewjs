<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>SurfView · cortical surfaces in the browser</title>
  <meta name="description" content="Interactive chapters showing SurfView, a Three.js library for cortical surface data: layers, thresholds, atlases, volume projection, time series and figure export." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b1118'/%3E%3Crect x='5' y='7' width='22' height='18' fill='%231c2732' stroke='%23e9f0f4' stroke-width='1.5'/%3E%3Cpath d='M10 19c2-6 9-8 12-4' fill='none' stroke='%23f2c230' stroke-width='2'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app" class="room">
    <header class="room-head">
      <a class="brand" href="./" aria-label="SurfView demo home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" /><path d="M7 15c1.6-4.6 7-6.2 9.8-3.1" /></svg>
        <span class="brand-name">SurfView</span>
      </a>
      <p class="room-tag">Cortical surface data in the browser, chapter by chapter.</p>
      <nav class="room-links" aria-label="Project links">
        <a href="https://bbuchsbaum.github.io/surfviewjs/">Guide</a>
        <a href="https://bbuchsbaum.github.io/surfviewjs/api/">API</a>
        <a href="https://github.com/bbuchsbaum/surfviewjs">Source</a>
        <a href="https://www.npmjs.com/package/surfview" id="npm-link">npm</a>
      </nav>
    </header>

    <nav class="strip nav" aria-label="Chapters">
      <div id="scenario-list" class="strip-banks"></div>
    </nav>

    <main class="box workspace" data-layout="standard">
      <div class="viewbox">
      <figure id="viewer-frame" class="film" aria-busy="false">
        <div id="viewer-slot" class="film-image"></div>
        <figcaption id="status-block" class="film-edge">
          <span class="edge-mark" id="edge-mark">SURFVIEW</span>
          <span id="status-text" role="status">Idle</span>
          <span id="perf-text"></span>
        </figcaption>
      </figure>
      </div>

      <aside class="margin" aria-labelledby="active-title">
        <header class="margin-head">
          <h1 id="active-title">SurfView</h1>
          <p id="active-desc"></p>
          <p id="active-synthetic" class="synthetic" hidden></p>
        </header>
        <details id="code-block" class="code-block" hidden>
          <summary>Code</summary>
          <div class="code-body">
            <pre><code id="code-text"></code></pre>
            <button type="button" class="action code-copy" id="code-copy">Copy</button>
          </div>
        </details>
        <div id="panel" class="margin-controls"></div>
        <footer class="margin-foot">
          <button id="reset-btn" type="button" class="action" disabled>Reset chapter</button>
        </footer>
      </aside>
    </main>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
