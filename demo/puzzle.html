<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Parcel puzzle · SurfView</title>
  <meta name="description" content="Schaefer and Glasser cortical parcels as interactive 3D pieces on the fs_LR inflated surface, rendered with SurfView." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b1118'/%3E%3Crect x='5' y='7' width='22' height='18' fill='%231c2732' stroke='%23e9f0f4' stroke-width='1.5'/%3E%3Cpath d='M10 19c2-6 9-8 12-4' fill='none' stroke='%23f2c230' stroke-width='2'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app" class="room">
    <header class="room-head">
      <a class="brand" href="./" aria-label="SurfView demo home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" /><path d="M7 15c1.6-4.6 7-6.2 9.8-3.1" /></svg>
        <span class="brand-name">SurfView</span>
      </a>
      <p class="room-tag">Cortical parcels, one piece at a time.</p>
      <nav class="room-links" aria-label="Project links">
        <a href="./?scenario=parcel-puzzle">Gallery</a>
        <a href="./map-lab.html">Parcel map lab</a>
        <a href="https://github.com/bbuchsbaum/surfviewjs">Source</a>
      </nav>
    </header>

    <main class="box workspace" data-layout="standard">
      <div class="viewbox">
      <figure id="viewer-frame" class="film" aria-busy="true">
        <div id="viewer-slot" class="film-image"><div id="viewer-mount" class="scenario-mount"></div></div>
        <figcaption id="status-block" class="film-edge">
          <span class="edge-mark" id="edge-mark">SURFVIEW</span>
          <span id="status-text" role="status">Loading</span>
          <span id="perf-text"></span>
        </figcaption>
      </figure>
      </div>

      <aside class="margin" aria-labelledby="active-title">
        <header class="margin-head">
          <h1 id="active-title">Parcel puzzle</h1>
          <p id="active-desc"></p>
          <p id="active-synthetic" class="synthetic" hidden></p>
        </header>
        <div id="panel" class="margin-controls"></div>
      </aside>
    </main>
  </div>
  <script type="module" src="./puzzle.ts"></script>
</body>
</html>
